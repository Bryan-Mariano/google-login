<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="duplicate login google">
    <meta name="keywords" content="google, login, page">
    <meta name="author" content="bryan">
    <meta name="robots" content="index. follow">


    <title>Google</title>

    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../fonts/index.css">

    <link rel="shortcut icon" href="../assets/icons/google-icon.svg" type="image/x-icon">


</head>
<body>


    <header class="header">
        <nav class="header__nav">
            <ul class="header__list">
                <li class="header__text-item text--light-sm">Gmail</li>
                <li class="header__text-item text--light-sm">Images</li>
                <li class="header__container-img ">
                    <img class="header__img-apps img--contain" src="../assets/icons/app-icon.svg" alt="app icon">
                </li>
                <li class="header__container-img">
                    <img class="header__img-user img--contain" src="../assets/icons/user-icon.svg" alt="user icon">
                </li>
            </ul>
        </nav>
    </header>

    <main class="login">


        <figure class="login-figure">
            <img class="login-figure__img-logo img--contain" src="../assets/images/google-image.png" alt="google logo">
        </figure>



        <form class="login-form">

            <div class="login-form__group-search">

                <button class="login-form__button-search button--icon">
                    <img class="login-form__img-search img--contain" src="../assets/icons/search-icon.svg" alt="button search icon">
                </button>

                <input class="login-form__input-search input--text text--light-sm" type="text">

                <button class="login-form__button-mic button--icon">
                    <img class="login-form__img-mic img--contain" src="../assets/icons/google-mic.svg" alt="button mic icon">
                </button>

                <button class="login-form__button-lens button--icon">
                    <img class="login-form__img-lens img--contain" src="../assets/icons/google-lens.svg" alt="button lens icon">
                </button>
            </div>

            <input class="login-form__button-submit button--lg text--light-sm" type="submit" value="Google search">

            <button class="login-form__button-lucky button--lg text--light-sm">
                I'm Feeling Lucky
            </button>
        </form>


        
        <p class="login-languages text--light-sm">
            Google offered in: 
            <a class="login-languages__text-spanish text--link" href="#">Español</a>
            <a class="login-languages__text-catala text--link" href="#">catalá</a>
            <a class="login-languages__text-galego text--link" href="#">galego</a>
            <a class="login-languages__text-euskera text--link" href="#">euskera</a>
        </p>


    </main>


    <footer class="footer">
        <ul class="footer__list-language list--links">
            <li class="footer__text-item text--light-sm">Spain</li>
        </ul>

        <hr class="footer__line">
        
        <ul class="footer__list-info list--links">
            <li class="footer__text-item text--light-sm">About</li>
            <li class="footer__text-item text--light-sm">Advertising</li>
            <li class="footer__text-item text--light-sm">Business</li>
            <li class="footer__text-item text--light-sm">How Search Works</li>
        </ul>
        <ul class="footer__list-data list--links">
            <li class="footer__text-item text--light-sm">Privacy</li>
            <li class="footer__text-item text--light-sm">Terms</li>
            <li class="footer__text-item text--light-sm">Settings</li>
        </ul>
    </footer>
    


    
</body>
</html>
